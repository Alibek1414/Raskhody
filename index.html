<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>Расходы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f7;--card:#fff;--text:#17171a;--muted:#8a8a8f;--blue:#007aff;--green:#34c759;--red:#ff3b30;--line:#e5e5ea}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}
.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 8px;background:rgba(242,242,247,.94);position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}
.topline{display:flex;justify-content:space-between;align-items:center}.title{font-size:32px;font-weight:750;letter-spacing:-1.2px}.month{font-size:15px;color:var(--muted);margin-top:2px;text-transform:capitalize}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:22px;box-shadow:0 1px 5px #0000000d}
main{padding:10px 16px}
.card{background:#fff;border-radius:22px;margin:10px 0;overflow:hidden;box-shadow:0 1px 4px #00000009}
.balance{padding:22px}.label{font-size:14px;color:var(--muted)}.total{font-size:39px;font-weight:800;letter-spacing:-1.4px;margin:2px 0 18px}.stats{display:flex;gap:9px}.stat{background:#f2f2f7;border-radius:16px;padding:12px;flex:1}.stat b{font-size:17px;display:block}.stat span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}.quick button{border:0;background:#f2f2f7;border-radius:17px;padding:10px 4px;font-size:12px;color:#333}.quick i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.section{font-size:21px;font-weight:750;margin:25px 4px 10px}.row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:#f2f2f7;font-size:21px;margin-right:12px}.grow{flex:1}.grow b{font-size:15px}.grow small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.amt{font-weight:700;font-size:15px}.del{border:0;background:none;color:#c7c7cc;font-size:21px;margin-left:8px;padding:5px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(249,249,249,.93);backdrop-filter:blur(20px);border-top:1px solid #d9d9dd;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{max-width:560px;width:100%;display:flex}.nav button{flex:1;border:0;background:none;color:#8e8e93;font-size:10px;padding:5px}.nav button.active{color:var(--blue)}.nav span{display:block;font-size:23px;margin-bottom:1px}
.screen{display:none}.screen.active{display:block}
.addbox{padding:18px}.amountInput{text-align:center;font-size:44px;font-weight:750;border:0;outline:0;width:100%;background:transparent;padding:16px 0;color:#111}.amountInput::placeholder{color:#c7c7cc}.field{margin:9px 0}.field label{font-size:12px;color:var(--muted);display:block;margin:0 0 6px 4px}.field input,.field select{width:100%;border:0;background:#f2f2f7;border-radius:14px;padding:14px;font-size:16px;outline:none}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.cat{border:2px solid transparent;background:#f2f2f7;border-radius:15px;padding:10px 3px;text-align:center;font-size:11px}.cat b{display:block;font-size:23px;margin-bottom:3px}.cat.selected{border-color:#007aff;background:#eef6ff}.save{width:100%;border:0;background:#007aff;color:#fff;border-radius:15px;padding:15px;font-size:17px;font-weight:700;margin-top:13px}.cancel{width:100%;border:0;background:#eee;color:#111;border-radius:15px;padding:14px;font-size:16px;margin-top:8px}
.chart{padding:18px}.bars{height:180px;display:flex;align-items:end;gap:7px}.barwrap{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:#007aff;border-radius:7px 7px 3px 3px;min-height:3px;margin-bottom:6px}.legend{font-size:13px;color:var(--muted);margin-top:13px}.catstat{padding:13px 16px;display:flex;align-items:center;gap:10px}.catstat .grow{font-size:14px}.progress{height:7px;background:#eee;border-radius:7px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:#007aff;border-radius:7px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}.note{font-size:12px;color:var(--muted);line-height:1.45}.settings button{width:100%;border:0;background:#fff;padding:16px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}.settings button:last-child{border:0;color:var(--red)}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="topline"><div><div class="title">Расходы</div><div class="month" id="month"></div></div><button class="iconbtn" onclick="openAdd()">＋</button></div></div>

<main>
<section id="home" class="screen active">
<div class="card balance"><div class="label">Потрачено в этом месяце</div><div class="total" id="total">0 ₸</div><div class="stats"><div class="stat"><b id="today">0 ₸</b><span>Сегодня</span></div><div class="stat"><b id="avg">0 ₸</b><span>В среднем / день</span></div></div></div>
<div class="card quick" id="quick"></div>
<div class="section">Последние расходы</div><div class="card" id="recent"></div>
</section>

<section id="stats" class="screen">
<div class="section">Статистика</div>
<div class="card chart"><div class="label">Расходы за последние 7 дней</div><div class="bars" id="bars"></div><div class="legend">По дням</div></div>
<div class="section">Категории</div><div class="card" id="catstats"></div>
</section>

<section id="history" class="screen">
<div class="section">История</div>
<div class="card" id="historyList"></div>
</section>

<section id="add" class="screen">
<div class="section">Новый расход</div>
<div class="card addbox">
<input id="amount" class="amountInput" type="number" inputmode="decimal" placeholder="0 ₸">
<div class="field"><label>Категория</label><div class="cats" id="cats"></div></div>
<div class="field"><label>Дата</label><input id="date" type="date"></div>
<div class="field"><label>Комментарий</label><input id="note" placeholder="Например, обед"></div>
<button class="save" onclick="saveExpense()">Добавить расход</button>
<button class="cancel" onclick="go('home')">Отмена</button>
</div>
</section>

<section id="settings" class="screen">
<div class="section">Настройки</div>
<div class="card settings">
<button onclick="exportCSV()">📤 Экспортировать расходы</button>
<button onclick="importHint()">💾 О резервной копии</button>
<button onclick="clearAll()">🗑 Удалить все данные</button>
</div>
<div class="card" style="padding:16px"><p class="note">Версия 2.0 хранит расходы локально на этом устройстве. Никаких аккаунтов, рекламы и платных функций.</p></div>
</section>
</main>
</div>

<nav class="nav"><div class="navin">
<button class="active" onclick="go('home',this)"><span>⌂</span>Главная</button>
<button onclick="go('stats',this)"><span>◔</span>Статистика</button>
<button onclick="go('history',this)"><span>☷</span>История</button>
<button onclick="go('add',this);prepAdd()"><span>＋</span>Добавить</button>
<button onclick="go('settings',this)"><span>⚙</span>Настройки</button>
</div></nav>

<script>
const KEY='expenses_v2';let data=JSON.parse(localStorage.getItem(KEY)||'[]');let selected='Еда';
const cats=[['🍔','Еда'],['🚕','Транспорт'],['🛒','Покупки'],['🏠','Дом'],['💊','Здоровье'],['🎬','Развлечения'],['📱','Связь'],['💼','Работа'],['🎁','Подарки'],['📦','Другое']];
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₸';
const iso=d=>d.toISOString().slice(0,10);const today=()=>iso(new Date());const curMonth=()=>today().slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function go(id,btn){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');
 if(btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
 if(id==='add')prepAdd();render();
}
function openAdd(){document.querySelectorAll('.nav button')[3].click()}
function prepAdd(){document.getElementById('date').value=today();document.getElementById('amount').focus()}
function render(){
 const m=curMonth(),cur=data.filter(x=>x.date.startsWith(m)),total=cur.reduce((a,x)=>a+x.amount,0);
 document.getElementById('month').textContent=new Date(m+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 document.getElementById('total').textContent=money(total);
 document.getElementById('today').textContent=money(cur.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0));
 const days=Math.max(1,new Date().getDate());document.getElementById('avg').textContent=money(total/days);
 document.getElementById('quick').innerHTML=cats.slice(0,8).map(c=>`<button onclick="quickAdd('${c[1]}')"><i>${c[0]}</i>${c[1]}</button>`).join('');
 document.getElementById('recent').innerHTML=rows(cur.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,8));
 document.getElementById('historyList').innerHTML=rows(data.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id));
 renderStats(cur);renderCats();
 document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat ${selected===c[1]?'selected':''}" onclick="selected='${c[1]}';render()"><b>${c[0]}</b>${c[1]}</button>`).join('');
}
function rows(arr){if(!arr.length)return '<div class="empty">Пока нет расходов</div>';return arr.map(x=>{let c=cats.find(c=>c[1]===x.category)||['📌',x.category];return `<div class="row"><div class="ico">${c[0]}</div><div class="grow"><b>${x.category}</b><small>${x.date.split('-').reverse().join('.')}${x.note?' • '+esc(x.note):''}</small></div><div class="amt">−${money(x.amount)}</div><button class="del" onclick="removeExpense(${x.id})">×</button></div>`}).join('')}
function renderStats(cur){
 const vals=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=iso(d),v=data.filter(x=>x.date===k).reduce((a,x)=>a+x.amount,0);vals.push({k,v,label:d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','')})}
 let mx=Math.max(1,...vals.map(x=>x.v));document.getElementById('bars').innerHTML=vals.map(x=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,x.v/mx*145)}px"></div>${x.label}</div>`).join('');
}
function renderCats(){
 const sums={};data.filter(x=>x.date.startsWith(curMonth())).forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);let entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...entries.map(x=>x[1]));
 document.getElementById('catstats').innerHTML=entries.length?entries.map(([cat,v])=>{let c=cats.find(x=>x[1]===cat)||['📌',cat];return `<div class="catstat"><div class="ico">${c[0]}</div><div class="grow">${cat}<div class="progress"><i style="width:${v/mx*100}%"></i></div></div><b>${money(v)}</b></div>`}).join(''):'<div class="empty">Нет данных</div>';
}
function quickAdd(cat){selected=cat;go('add');setTimeout(()=>document.getElementById('amount').focus(),50)}
function saveExpense(){
 let amount=Number(document.getElementById('amount').value);if(!amount||amount<=0){alert('Введите сумму');return}
 data.push({id:Date.now(),amount,category:selected,date:document.getElementById('date').value||today(),note:document.getElementById('note').value.trim()});save();
 document.getElementById('amount').value='';document.getElementById('note').value='';go('home',document.querySelector('.nav button'));
}
function removeExpense(id){data=data.filter(x=>x.id!==id);save();render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function exportCSV(){let rows=[['Дата','Категория','Сумма','Комментарий'],...data.map(x=>[x.date,x.category,x.amount,x.note||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='rashody.csv';a.click()}
function importHint(){alert('Для резервной копии используйте «Экспортировать расходы». CSV-файл можно сохранить в iCloud Drive или отправить себе.')};
function clearAll(){if(confirm('Удалить все расходы? Это действие нельзя отменить.')){data=[];save();render()}}
render();
</script>
</body>
</html>
